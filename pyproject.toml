[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config/settings/local.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_tests.py", "tests.py"]

[tool.coverage.run]
branch = true
source = [
    "adjuntos",
    "auditoria",
    "autorizacion",
    "cuentas",
    "notificaciones",
    "tareas",
]

[tool.coverage.report]
show_missing = true
