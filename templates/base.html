{% load static %}
<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}TaskPlanner{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    {% block estilos %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
    {% block scripts %}{% endblock %}
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% if messages %}
      <div class="container mt-3" aria-live="polite">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block contenido %}{% endblock %}
  </body>
</html>
