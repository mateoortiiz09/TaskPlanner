{% extends "base.html" %}

{% block titulo %}Ingresar{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h4 mb-3">Ingresar</h1>
    {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>
    {% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Correo electrónico</label>
        <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
               class="form-control" value="{{ form.username.value|default_if_none:'' }}"
               autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
               class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
